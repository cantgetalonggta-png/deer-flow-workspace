name: skill-tree-cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run skill engine cycle
        run: |
          python - <<'PY'
          print('skill-tree cycle placeholder — load ROOT_WORKSPACE/skill-engine/state.json')
          PY
